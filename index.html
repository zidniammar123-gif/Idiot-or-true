<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sound Effect Player</title>
</head>
<body>

    <h3>Putar Efek Suara Tanpa Buka Link</h3>
    
    <!-- Tombol Pemicu -->
    <button onclick="mainkanSuara()">Mainkan Efek Suara</button>

    <script>
        function mainkanSuara() {
            // PERBAIKAN: Menggunakan link langsung ke file .mp3 mentah
            var urlSuara = "https://myinstants.com";
            
            var audio = new Audio(urlSuara);
            audio.play().catch(function(error) {
                console.log("Gagal memutar:", error);
            });
        }
    </script>

</body>
</html>
