<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Effect Player</title>
    <style>
        /* Gaya untuk mengatur posisi tombol di tengah halaman */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        h3 {
            margin-bottom: 20px;
            color: #333;
        }

        /* PERBAIKAN: Membuat tombol menjadi sangat besar dan menarik */
        .btn-sound {
            padding: 25px 60px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #007bff; /* Warna biru */
            border: none;
            border-radius: 50px; /* Membuat sudut tombol melengkung bulat */
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 123, 255, 0.3); /* Efek bayangan */
            transition: all 0.2s ease; /* Animasi halus */
        }

        /* Efek saat kursor mouse berada di atas tombol */
        .btn-sound:hover {
            background-color: #0056b3; /* Biru lebih gelap */
            box-shadow: 0 15px 20px rgba(0, 123, 255, 0.4);
            transform: translateY(-2px); /* Tombol sedikit naik */
        }

        /* Efek saat tombol ditekan/diklik */
        .btn-sound:active {
            transform: translateY(1px); /* Tombol sedikit turun */
            box-shadow: 0 5px 10px rgba(0, 123, 255, 0.2);
        }
    </style>
</head>
<body>

    <h3>Putar vidio</h3>
    
    <!-- Tombol Pemicu yang sudah diperbesar -->
    <button class="btn-sound" onclick="mainkanSuara()">📢 Mainkan Efek Suara</button>

    <script>
        function mainkanSuara() {
            var urlSuara = "https://www.myinstants.com/en/instant/fahhhhhhhhhhhhhh-3525/?utm_source=copy&utm_medium=share";
            
            var audio = new Audio(urlSuara);
            audio.play().catch(function(error) {
                console.log("Gagal memutar:", error);
            });
        }
    </script>

</body>
</html>
