<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Effect Player</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .btn-sound {
            padding: 25px 60px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #28a745; /* Diubah jadi warna hijau sukses */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(40, 167, 69, 0.3);
            transition: all 0.2s ease;
        }

        .btn-sound:hover {
            background-color: #218838;
            box-shadow: 0 15px 20px rgba(40, 167, 69, 0.4);
            transform: translateY(-2px);
        }

        .btn-sound:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(40, 167, 69, 0.2);
        }
    </style>
</head>
<body>

    <h3>Putar Efek Suara Internal</h3>
    
    <!-- Tombol Pemicu -->
    <button class="btn-sound" onclick="mainkanSuara()">📢 Mainkan Efek Suara</button>

    <script>
        // PERBAIKAN: Masukkan nama file mp3 Anda yang ada di folder yang sama
        var audio = new Audio("suaraku.mp3");

        function mainkanSuara() {
            // Reset ke awal agar bisa diklik berkali-kali tanpa macet
            audio.currentTime = 0; 
            
            audio.play().catch(function(error) {
                console.log("Gagal memutar suara:", error);
                alert("Gagal memutar! Pastikan nama file MP3 di kode sudah sama persis dengan yang di GitHub.");
            });
        }
    </script>

</body>
</html>
