<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Effect Player</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }
        .btn-sound {
            padding: 25px 60px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(40, 167, 69, 0.3);
        }
    </style>
</head>
<body>

    <h3>Putar Efek Suara GitHub</h3>
    
    <!-- Tombol Pemicu -->
    <button class="btn-sound" onclick="mainkanSuara()">📢 Mainkan Efek Suara</button>

    <script>
        // PENTING: Ganti tulisan di bawah ini sesuai nama asli file Anda di GitHub
        var namaFileSuara = "suaraku.mp3"; 

        var audio = new Audio(namaFileSuara);

        function mainkanSuara() {
            audio.currentTime = 0; 
            
            audio.play().then(() => {
                console.log("Suara berhasil berbunyi!");
            }).catch(function(error) {
                // Jika gagal, browser akan memunculkan pop-up error agar kita tahu penyebabnya
                alert("Gagal memutar! Error: " + error.message + 
                      "\n\nTips: Pastikan file '" + namaFileSuara + "' sudah diupload ke GitHub dengan nama & huruf yang SAMA PERSIS.");
            });
        }
    </script>

</body>
</html>
